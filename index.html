<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Galerie Vidéo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .main-player {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            max-height: 80vh;
        }
        .video-info {
            padding: 15px 20px;
            background: #1a1a1a;
        }
        .video-info h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .video-list-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .video-item {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }
        .video-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            border-color: #0088cc;
        }
        .video-item.active {
            border-color: #0088cc;
            background: #252525;
        }
        .video-item img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }
        .video-item .title {
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
        }
        .video-item.active .title {
            color: #0088cc;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="main-player">
        <video id="mainVideo" controls poster="https://via.placeholder.com/800x450/1a1a1a/ffffff?text=Chargement...">
            <source src="" type="video/mp4">
            Votre navigateur ne supporte pas la lecture vidéo.
        </video>
        <div class="video-info">
            <h2 id="mainTitle">Chargement de la playlist...</h2>
        </div>
    </div>

    <div class="video-list-title">📁 Playlist (<span id="videoCount">0</span> vidéos)</div>
    <div class="video-grid" id="videoGrid">
        <div class="loading">⏳ Chargement des vidéos...</div>
    </div>

    <script>
        // URL du fichier JSON (sur le même domaine GitHub)
        const JSON_URL = 'videos.json';

        // Fonction pour charger les vidéos depuis le JSON
        async function chargerPlaylist() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error('Fichier JSON introuvable');
                const videos = await response.json();

                const grid = document.getElementById('videoGrid');
                const countSpan = document.getElementById('videoCount');
                countSpan.textContent = videos.length;

                // Vider le message de chargement
                grid.innerHTML = '';

                // Créer les vignettes dynamiquement
                videos.forEach((video, index) => {
                    const item = document.createElement('div');
                    item.className = 'video-item' + (index === 0 ? ' active' : '');
                    item.onclick = () => jouerVideo(video, item);

                    item.innerHTML = `
                        <img src="${video.vignette}" alt="${video.titre}" onerror="this.src='https://via.placeholder.com/320x180/333/fff?text=Pas+de+vignette'">
                        <div class="title">${video.titre}</div>
                    `;
                    grid.appendChild(item);
                });

                // Lancer automatiquement la première vidéo (sans autoplay pour respecter les navigateurs)
                if (videos.length > 0) {
                    document.getElementById('mainTitle').textContent = videos[0].titre;
                    document.querySelector('#mainVideo source').src = videos[0].video;
                    document.getElementById('mainVideo').poster = videos[0].vignette;
                }

            } catch (error) {
                document.getElementById('videoGrid').innerHTML = 
                    `<div class="loading">❌ Erreur : ${error.message}<br>Vérifiez que le fichier videos.json existe.</div>`;
            }
        }

        // Fonction pour jouer une vidéo au clic
        function jouerVideo(video, element) {
            const player = document.getElementById('mainVideo');
            const source = player.querySelector('source');
            const titre = document.getElementById('mainTitle');

            source.src = video.video;
            player.poster = video.vignette;
            titre.textContent = video.titre;

            player.load();
            player.play().catch(e => console.log('Autoplay bloqué'));

            // Mettre à jour la classe active
            document.querySelectorAll('.video-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            // Scroll smooth vers le lecteur
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Charger la playlist au démarrage
        chargerPlaylist();
    </script>

</body>
</html>
