<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Galerie Vidéo - Ultimate</title>
    <meta name="theme-color" content="#e50914">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <style>
        :root {
            --primary: #e50914;
            --primary-glow: rgba(229, 9, 20, 0.4);
            --bg-dark: #0f0f0f;
            --bg-card: #181818;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }
        [data-theme="light"] {
            --bg-dark: #f5f5f5;
            --bg-card: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            padding: 20px; max-width: 1300px; margin: 0 auto;
            animation: fadeIn 0.6s ease-out; position: relative; z-index: 1;
            transition: background-color 0.3s, color 0.3s;
        }

        .ambilight-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(80px) brightness(0.25); z-index: -1;
            transition: background-image 0.8s ease-in-out; opacity: 0;
        }
        .ambilight-bg.active { opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { background-color: #181818; } 50% { background-color: #252525; } }
        @keyframes slideUp { from { transform: translate(-50%, 100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes slideDown { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, 100px); opacity: 0; } }
        @keyframes heartBeat { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* Header avec contrôles */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .theme-toggle, .settings-btn {
            background: var(--bg-card); border: 1px solid #333; color: var(--text-main);
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
            transition: 0.2s;
        }
        .theme-toggle:hover, .settings-btn:hover { background: #333; }

        .search-container { margin-bottom: 20px; position: relative; }
        .search-input {
            width: 100%; padding: 14px 20px 14px 45px; background: rgba(24, 24, 24, 0.8);
            border: 1px solid #333; border-radius: 8px; color: white; font-size: 1rem;
            outline: none; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .voice-btn {
            position: absolute; right: 50px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 1.2rem; transition: 0.2s;
        }
        .voice-btn:hover { color: var(--primary); }
        .voice-btn.listening { color: var(--primary); animation: pulse 1s infinite; }
        .search-shortcut {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: #333; color: #aaa; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; border: 1px solid #444;
        }

        .continue-watching-section { margin-bottom: 30px; display: none; }
        .continue-watching-section.visible { display: block; animation: fadeIn 0.5s ease; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; scroll-behavior: smooth; }
        .horizontal-scroll::-webkit-scrollbar { height: 6px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .hw-item {
            min-width: 280px; background: var(--bg-card); border-radius: 6px; overflow: hidden;
            cursor: pointer; transition: transform 0.2s; position: relative; flex-shrink: 0;
        }
        .hw-item:hover { transform: scale(1.05); z-index: 10; }
        .hw-item img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .hw-progress { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--primary); width: 30%; }
        .hw-title { padding: 8px 10px; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .main-player {
            background: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 20px;
            border: 1px solid #333; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; z-index: 100;
        }
        .main-player.cinema-mode {
            box-shadow: 0 0 80px var(--primary-glow); border-color: var(--primary);
            max-width: 100vw; margin: 0 -20px 30px -20px;
        }
        .main-player.mini-player {
            position: fixed; bottom: 20px; right: 20px; width: 320px; height: 180px;
            margin: 0; border-radius: 8px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .main-player.mini-player video { max-height: 180px; }
        .main-player.mini-player .video-info, .main-player.mini-player .btn-action { display: none !important; }
        
        video { width: 100%; height: auto; display: block; max-height: 70vh; background: #000; }
        .video-info {
            padding: 15px 20px; background: rgba(24, 24, 24, 0.95); border-top: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            backdrop-filter: blur(10px);
        }
        .video-info h2 { font-size: 1.3rem; font-weight: 600; flex: 1; }
        .badge-resume {
            background: var(--primary); color: white; font-size: 0.75rem;
            padding: 4px 10px; border-radius: 4px; display: none; white-space: nowrap; font-weight: 600;
        }

        .quick-actions { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }
        .btn-action {
            background: #333; color: white; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
            transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-action:hover { background: #444; transform: translateY(-1px); }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: #f40612; }
        .stats-display { color: var(--text-muted); font-size: 0.85rem; margin-left: auto; }

        .video-list-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .filter-tabs { display: flex; gap: 10px; }
        .filter-tab {
            background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 14px;
            border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
        }
        .filter-tab.active, .filter-tab:hover { background: #fff; color: #000; border-color: #fff; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .video-item {
            background: var(--bg-card); border-radius: 8px; overflow: hidden;
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .video-item:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.6); }
        .video-item.active { outline: 2px solid var(--primary); outline-offset: 2px; }
        .video-item.focused { outline: 3px solid #fff; outline-offset: 2px; transform: scale(1.05); z-index: 10; }
        
        .video-item img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #111; transition: transform 0.3s ease; }
        .video-item:hover img { transform: scale(1.05); }
        
        .fav-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
            border: none; color: white; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: 0.2s; z-index: 5; opacity: 0;
        }
        .video-item:hover .fav-btn { opacity: 1; }
        .fav-btn.is-fav { color: var(--primary); opacity: 1; animation: heartBeat 0.3s ease; }
        
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--primary); width: 0%; transition: width 0.3s; z-index: 2; }
        .video-item .title {
            padding: 12px; font-size: 0.9rem; font-weight: 500; color: #ddd;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3;
        }
        .video-item.active .title { color: #fff; font-weight: 700; }

        .loading-state, .error-state, .empty-state { text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1; }
        .skeleton { background: linear-gradient(90deg, #181818 25%, #252525 50%, #181818 75%); background-size: 200% 100%; animation: pulse 1.5s infinite; border-radius: 8px; height: 180px; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(24, 24, 24, 0.95); color: white; padding: 12px 24px;
            border-radius: 8px; border-left: 4px solid var(--primary); z-index: 10000;
            animation: slideUp 0.3s ease; font-weight: 500; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .custom-context-menu {
            position: absolute; background: #252525; border: 1px solid #444; border-radius: 8px;
            padding: 8px 0; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10001;
            display: none; animation: slideUp 0.15s ease;
        }
        .context-item {
            padding: 10px 16px; cursor: pointer; font-size: 0.9rem; color: #ddd; display: flex; align-items: center; gap: 10px;
        }
        .context-item:hover { background: var(--primary); color: white; }

        /* Modal Settings */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 10002; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); padding: 30px; border-radius: 12px;
            max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
            border: 1px solid #444;
        }
        .modal h3 { margin-bottom: 20px; color: var(--text-main); }
        .modal-section { margin-bottom: 20px; }
        .modal-section label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
        .color-option {
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: 0.2s;
        }
        .color-option:hover { transform: scale(1.1); }
        .color-option.active { border-color: white; }
        .modal-btn {
            background: var(--primary); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 10px;
        }
        .modal-btn:hover { opacity: 0.9; }
        .modal-btn.secondary { background: #333; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .video-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .video-info { flex-direction: column; align-items: flex-start; }
            .quick-actions { justify-content: center; }
            .stats-display { margin-left: 0; width: 100%; text-align: center; margin-top: 5px; }
            .search-shortcut { display: none; }
            .main-player.mini-player { width: 160px; height: 90px; bottom: 10px; right: 10px; }
            .main-player.mini-player video { max-height: 90px; }
            .top-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="ambilight-bg" id="ambilightBg"></div>

    <div class="top-bar">
        <h1 style="font-size: 1.5rem; font-weight: 700;">🎬 Ma Galerie</h1>
        <div style="display: flex; gap: 10px;">
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Thème</button>
            <button class="settings-btn" onclick="openSettings()">️ Paramètres</button>
        </div>
    </div>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un titre...">
        <button class="voice-btn" id="voiceBtn" onclick="startVoiceSearch()" title="Recherche vocale">🎙️</button>
        <span class="search-shortcut">Ctrl K</span>
    </div>

    <div class="continue-watching-section" id="continueSection">
        <div class="section-title">▶ Reprendre la lecture</div>
        <div class="horizontal-scroll" id="continueScroll"></div>
    </div>

    <div class="main-player" id="mainPlayer">
        <video id="mainVideo" controls poster="https://via.placeholder.com/800x450/111111/555555?text=Chargement...">
            <source src="" type="video/mp4">
            Votre navigateur ne supporte pas la lecture vidéo.
        </video>
        <div class="video-info">
            <h2 id="mainTitle">Chargement de votre bibliothèque...</h2>
            <span class="badge-resume" id="resumeBadge">▶ Reprendre</span>
            <button class="btn-action" onclick="toggleCinemaMode()" title="Mode Cinéma (C)"> Cinéma</button>
        </div>
    </div>

    <div class="quick-actions">
        <button class="btn-action btn-primary" onclick="jouerVideoAleatoire()">🎲 Aléatoire</button>
        <button class="btn-action" onclick="genererLienPartage()">🔗 Partager</button>
        <button class="btn-action" onclick="showStats()"> Stats</button>
        <div class="stats-display" id="statsDisplay">📊 Calcul des stats...</div>
    </div>

    <div class="video-list-header">
        <span>📁 Bibliothèque</span>
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filtrer('all', this)">Toutes</button>
            <button class="filter-tab" onclick="filtrer('favorites', this)">❤️ Favoris</button>
        </div>
    </div>
    
    <div class="video-grid" id="videoGrid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <div class="custom-context-menu" id="contextMenu">
        <div class="context-item" onclick="contextAction('play')">▶ Lire maintenant</div>
        <div class="context-item" onclick="contextAction('fav')">❤️ Ajouter aux favoris</div>
        <div class="context-item" onclick="contextAction('copy')">🔗 Copier le lien</div>
    </div>

    <!-- Modal Paramètres -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ Paramètres</h3>
            
            <div class="modal-section">
                <label>🎨 Couleur principale</label>
                <div class="color-picker">
                    <div class="color-option active" style="background: #e50914;" onclick="changeColor('#e50914', this)"></div>
                    <div class="color-option" style="background: #0088cc;" onclick="changeColor('#0088cc', this)"></div>
                    <div class="color-option" style="background: #9b59b6;" onclick="changeColor('#9b59b6', this)"></div>
                    <div class="color-option" style="background: #27ae60;" onclick="changeColor('#27ae60', this)"></div>
                    <div class="color-option" style="background: #f39c12;" onclick="changeColor('#f39c12', this)"></div>
                </div>
            </div>

            <div class="modal-section">
                <label> Sauvegardes</label>
                <button class="modal-btn" onclick="exportData()">📤 Exporter mes données</button>
                <button class="modal-btn secondary" onclick="document.getElementById('importFile').click()">📥 Importer</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
            </div>

            <div class="modal-section">
                <label>️ Réinitialisation</label>
                <button class="modal-btn secondary" onclick="resetAllData()">Effacer toutes les données</button>
            </div>

            <div style="margin-top: 30px; text-align: right;">
                <button class="modal-btn" onclick="closeSettings()">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        const ARCHIVE_USERNAME = "Mikeboy58";
        const MAX_VIDEOS = 100;
        let allVideos = [];
        let currentVideoIndex = -1;
        let favorites = JSON.parse(localStorage.getItem('myFavorites') || '[]');
        let playbackSpeeds = [0.5, 1, 1.25, 1.5, 2];
        let currentSpeedIndex = 1;
        let contextTargetVideo = null;
        let focusedGridIndex = -1;
        let viewingHistory = JSON.parse(localStorage.getItem('viewingHistory') || '[]');

        // --- PWA: Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW non enregistré'));
        }

        // --- UTILITAIRES ---
        function obtenirVignetteAuto(urlVideo) {
            const match = urlVideo.match(/\/(?:items|download)\/([^\/]+)\//);
            return match ? `https://archive.org/download/${match[1]}/__ia_thumb.jpg` : 'https://via.placeholder.com/320x180/222/888?text=No+Thumb';
        }
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0m 00s";
            const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
            return `${m}m ${s < 10 ? '0' : ''}${s}s`;
        }
        function showToast(message, duree = 3000) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast'; toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'slideDown 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, duree);
        }

        // --- THÈME & COULEUR ---
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            showToast(newTheme === 'light' ? '☀️ Mode clair activé' : '🌙 Mode sombre activé');
        }

        function changeColor(color, element) {
            document.documentElement.style.setProperty('--primary', color);
            document.documentElement.style.setProperty('--primary-glow', color + '66');
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            localStorage.setItem('primaryColor', color);
            showToast('🎨 Couleur modifiée');
        }

        // Charger les préférences sauvegardées
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
        const savedColor = localStorage.getItem('primaryColor');
        if (savedColor) {
            document.documentElement.style.setProperty('--primary', savedColor);
            document.documentElement.style.setProperty('--primary-glow', savedColor + '66');
        }

        // --- PARAMÈTRES MODAL ---
        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

        function exportData() {
            const data = {
                favorites,
                viewingHistory,
                stats: JSON.parse(localStorage.getItem('viewingStats') || '{}'),
                progress: {}
            };
            // Récupérer toutes les progressions
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('progress_')) {
                    data.progress[key] = localStorage.getItem(key);
                }
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `backup-galerie-${Date.now()}.json`;
            a.click(); URL.revokeObjectURL(url);
            showToast(' Données exportées');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.favorites) { favorites = data.favorites; localStorage.setItem('myFavorites', JSON.stringify(favorites)); }
                    if (data.viewingHistory) { viewingHistory = data.viewingHistory; localStorage.setItem('viewingHistory', JSON.stringify(viewingHistory)); }
                    if (data.stats) localStorage.setItem('viewingStats', JSON.stringify(data.stats));
                    if (data.progress) {
                        Object.entries(data.progress).forEach(([key, value]) => localStorage.setItem(key, value));
                    }
                    showToast('📥 Données importées avec succès');
                    afficherGrille(allVideos);
                } catch (err) {
                    showToast('❌ Erreur lors de l\'import');
                }
            };
            reader.readAsText(file);
        }

        function resetAllData() {
            if (confirm('⚠️ Êtes-vous sûr de vouloir effacer TOUTES vos données (favoris, progression, stats) ?')) {
                localStorage.clear();
                favorites = [];
                viewingHistory = [];
                showToast('🗑️ Toutes les données ont été effacées');
                location.reload();
            }
        }

        // --- RECHERCHE VOCALE ---
        function startVoiceSearch() {
            if (!('webkitSpeechRecognition' in window)) {
                showToast('❌ Recherche vocale non supportée');
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;

            const voiceBtn = document.getElementById('voiceBtn');
            voiceBtn.classList.add('listening');

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('searchInput').value = transcript;
                document.getElementById('searchInput').dispatchEvent(new Event('input'));
                voiceBtn.classList.remove('listening');
                showToast(`️ Recherche: "${transcript}"`);
            };

            recognition.onerror = () => {
                voiceBtn.classList.remove('listening');
                showToast(' Erreur de reconnaissance vocale');
            };

            recognition.onend = () => voiceBtn.classList.remove('listening');
            recognition.start();
        }

        // --- STATS AVANCÉES ---
        function mettreAJourStats(dureeSeconds) {
            let stats = JSON.parse(localStorage.getItem('viewingStats') || '{"totalTime": 0, "videosWatched": 0, "dailyStats": {}}');
            stats.totalTime += dureeSeconds;
            stats.videosWatched += 1;
            
            const today = new Date().toISOString().split('T')[0];
            if (!stats.dailyStats[today]) stats.dailyStats[today] = 0;
            stats.dailyStats[today] += dureeSeconds;
            
            localStorage.setItem('viewingStats', JSON.stringify(stats));
            afficherStats();
        }

        function afficherStats() {
            const stats = JSON.parse(localStorage.getItem('viewingStats') || '{"totalTime": 0, "videosWatched": 0}');
            const h = Math.floor(stats.totalTime / 3600); const m = Math.floor((stats.totalTime % 3600) / 60);
            document.getElementById('statsDisplay').textContent = ` ${stats.videosWatched} vidéos (${h}h ${m}min)`;
        }

        function showStats() {
            const stats = JSON.parse(localStorage.getItem('viewingStats') || '{"totalTime": 0, "videosWatched": 0, "dailyStats": {}}');
            const h = Math.floor(stats.totalTime / 3600);
            const m = Math.floor((stats.totalTime % 3600) / 60);
            const days = Object.keys(stats.dailyStats || {}).length;
            
            alert(`📊 Statistiques de visionnage:\n\n ${stats.videosWatched} vidéos vues\n⏱️ ${h}h ${m}min total\n📅 ${days} jours d'activité\n\nMerci d'utiliser Ma Galerie !`);
        }

        // --- GESTION DES FAVORIS ---
        function toggleFavorite(videoUrl, event) {
            if(event) event.stopPropagation();
            const index = favorites.indexOf(videoUrl);
            if (index === -1) { favorites.push(videoUrl); showToast("❤️ Ajouté aux favoris"); } 
            else { favorites.splice(index, 1); showToast("Retiré des favoris"); }
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
            document.querySelectorAll('.fav-btn').forEach(btn => {
                if (btn.dataset.url === videoUrl) {
                    btn.classList.toggle('is-fav', favorites.includes(videoUrl));
                    btn.innerHTML = favorites.includes(videoUrl) ? '❤️' : '🤍';
                }
            });
            if (document.querySelector('.filter-tab.active').textContent.includes('Favoris')) filtrer('favorites', document.querySelector('.filter-tab.active'));
        }

        // --- CHARGEMENT ---
        async function chargerToutesLesVideos() {
            let combinedVideos = [];
            try {
                try {
                    const res = await fetch('videos.json');
                    if (res.ok) {
                        const jsonVideos = await res.json();
                        combinedVideos = [...combinedVideos, ...jsonVideos.map(v => ({ titre: v.titre, video: v.video, vignette: v.vignette || obtenirVignetteAuto(v.video), source: 'json' }))];
                    }
                } catch (e) { console.log("ℹ️ Pas de videos.json"); }

                const apiUrl = `https://archive.org/advancedsearch.php?q=uploader:"${ARCHIVE_USERNAME}"&fl[]=identifier,title,publicdate&sort[]=-publicdate&output=json&rows=${MAX_VIDEOS}`;
                const response = await fetch(apiUrl); const data = await response.json();
                if (data.response.numFound > 0) {
                    for (const doc of data.response.docs) {
                        const identifier = doc.identifier; let mp4File = `${identifier}.mp4`;
                        try {
                            const filesRes = await fetch(`https://archive.org/metadata/${identifier}`);
                            const filesData = await filesRes.json();
                            if (filesData.files) {
                                let biggestSize = 0;
                                for (const file of filesData.files) {
                                    if (file.name && file.name.endsWith('.mp4') && file.format === 'MPEG4') {
                                        const size = parseInt(file.size) || 0;
                                        if (size > biggestSize) { biggestSize = size; mp4File = file.name; }
                                    }
                                }
                            }
                        } catch (e) {}
                        const videoUrl = `https://archive.org/download/${identifier}/${mp4File}`;
                        combinedVideos.push({ titre: doc.title || identifier, video: videoUrl, vignette: `https://archive.org/download/${identifier}/__ia_thumb.jpg`, source: 'archive', date: doc.publicdate });
                    }
                }

                const uniqueMap = new Map();
                for (const v of combinedVideos) { if (!uniqueMap.has(v.video)) uniqueMap.set(v.video, v); }
                allVideos = Array.from(uniqueMap.values()).sort((a, b) => { if (a.date && b.date) return new Date(b.date) - new Date(a.date); return 0; });

                afficherGrille(allVideos); genererContinueWatching(); restaurerSession(); afficherStats();
            } catch (error) {
                document.getElementById('videoGrid').innerHTML = `<div class="error-state">❌ Erreur : ${error.message}</div>`;
            }
        }

        function genererContinueWatching() {
            const section = document.getElementById('continueSection'); const scrollContainer = document.getElementById('continueScroll');
            scrollContainer.innerHTML = ''; let hasItems = false;
            allVideos.forEach(video => {
                const savedTime = localStorage.getItem(`progress_${video.video}`);
                if (savedTime && parseFloat(savedTime) > 10) {
                    hasItems = true;
                    const div = document.createElement('div'); div.className = 'hw-item';
                    div.onclick = () => jouerVideo(allVideos.indexOf(video));
                    div.innerHTML = `<img src="${video.vignette}" alt="${video.titre}"><div class="hw-progress"></div><div class="hw-title">${video.titre}</div>`;
                    scrollContainer.appendChild(div);
                }
            });
            if (hasItems) section.classList.add('visible');
        }

        function filtrer(type, btnElement) {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            btnElement.classList.add('active'); focusedGridIndex = -1;
            if (type === 'all') afficherGrille(allVideos);
            else if (type === 'favorites') afficherGrille(allVideos.filter(v => favorites.includes(v.video)));
        }

        function afficherGrille(videosAAfficher) {
            const grid = document.getElementById('videoGrid'); grid.innerHTML = '';
            if (videosAAfficher.length === 0) { grid.innerHTML = '<div class="empty-state">Aucun résultat.</div>'; return; }

            videosAAfficher.forEach((video, index) => {
                const originalIndex = allVideos.indexOf(video);
                const isActive = originalIndex === currentVideoIndex;
                const savedTime = localStorage.getItem(`progress_${video.video}`);
                const isFav = favorites.includes(video.video);

                const item = document.createElement('div');
                item.className = `video-item ${isActive ? 'active' : ''}`;
                item.dataset.index = originalIndex;
                item.onclick = () => jouerVideo(originalIndex);
                
                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    contextTargetVideo = video;
                    const menu = document.getElementById('contextMenu');
                    menu.style.display = 'block';
                    menu.style.left = `${e.pageX}px`;
                    menu.style.top = `${e.pageY}px`;
                });

                item.innerHTML = `
                    <button class="fav-btn ${isFav ? 'is-fav' : ''}" data-url="${video.video}" onclick="toggleFavorite('${video.video}', event)">${isFav ? '❤️' : '🤍'}</button>
                    <img src="${video.vignette}" alt="${video.titre}" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/222/888?text=Erreur'">
                    <div class="progress-bar" style="width: ${savedTime ? '30%' : '0%'}"></div>
                    <div class="title">${video.titre}</div>
                `;
                grid.appendChild(item);
            });
        }

        function jouerVideo(index) {
            if (index < 0 || index >= allVideos.length) return;
            currentVideoIndex = index; focusedGridIndex = index;
            const videoData = allVideos[index];
            const mainVideo = document.getElementById('mainVideo');
            const ambilight = document.getElementById('ambilightBg');

            ambilight.style.backgroundImage = `url('${videoData.vignette}')`; ambilight.classList.add('active');
            document.getElementById('mainTitle').textContent = videoData.titre;
            mainVideo.querySelector('source').src = videoData.video;
            mainVideo.poster = videoData.vignette;
            mainVideo.playbackRate = playbackSpeeds[currentSpeedIndex];

            const savedTime = localStorage.getItem(`progress_${videoData.video}`);
            if (savedTime && parseFloat(savedTime) > 5) {
                document.getElementById('resumeBadge').style.display = 'inline-block';
                document.getElementById('resumeBadge').textContent = `▶ Reprendre à ${formatTime(savedTime)}`;
                mainVideo.currentTime = parseFloat(savedTime);
            } else {
                document.getElementById('resumeBadge').style.display = 'none';
                mainVideo.currentTime = 0;
            }

            mainVideo.load(); mainVideo.play().catch(() => {});
            
            if (index < allVideos.length - 1) {
                const nextVideo = document.createElement('link');
                nextVideo.rel = 'prefetch';
                nextVideo.href = allVideos[index + 1].video;
                document.head.appendChild(nextVideo);
            }

            const currentFilter = document.querySelector('.filter-tab.active').textContent.includes('Favoris') ? 'favorites' : 'all';
            filtrer(currentFilter, document.querySelector('.filter-tab.active'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
            localStorage.setItem('lastVideoUrl', videoData.video);
        }

        function setupProgressSaving() {
            const video = document.getElementById('mainVideo');
            video.addEventListener('timeupdate', () => {
                if (currentVideoIndex !== -1 && !video.ended && allVideos[currentVideoIndex]) {
                    localStorage.setItem(`progress_${allVideos[currentVideoIndex].video}`, video.currentTime);
                }
            });
            video.addEventListener('ended', () => {
                if (currentVideoIndex !== -1 && allVideos[currentVideoIndex]) {
                    localStorage.removeItem(`progress_${allVideos[currentVideoIndex].video}`);
                    mettreAJourStats(video.duration); genererContinueWatching();
                    if (currentVideoIndex < allVideos.length - 1) {
                        showToast("⏭️ Lecture de la vidéo suivante...");
                        setTimeout(() => jouerVideo(currentVideoIndex + 1), 1500);
                    }
                }
            });
        }

        function restaurerSession() {
            const lastVideoUrl = localStorage.getItem('lastVideoUrl');
            if (lastVideoUrl) {
                const index = allVideos.findIndex(v => v.video === lastVideoUrl);
                if (index !== -1) {
                    currentVideoIndex = index; const v = allVideos[index];
                    document.getElementById('mainTitle').textContent = v.titre;
                    document.getElementById('mainVideo').querySelector('source').src = v.video;
                    document.getElementById('mainVideo').poster = v.vignette;
                    document.getElementById('ambilightBg').style.backgroundImage = `url('${v.vignette}')`;
                    document.getElementById('ambilightBg').classList.add('active');
                    const savedTime = localStorage.getItem(`progress_${v.video}`);
                    if (savedTime && parseFloat(savedTime) > 5) {
                        document.getElementById('resumeBadge').style.display = 'inline-block';
                        document.getElementById('resumeBadge').textContent = `▶ Reprendre (${formatTime(savedTime)})`;
                        document.getElementById('mainVideo').currentTime = parseFloat(savedTime);
                    }
                }
            }
        }

        function jouerVideoAleatoire() { if (allVideos.length === 0) return; jouerVideo(Math.floor(Math.random() * allVideos.length)); showToast(`🎲 Lecture aléatoire`); }
        function genererLienPartage() {
            if (currentVideoIndex === -1) { showToast("⚠️ Lancez d'abord une vidéo"); return; }
            const v = allVideos[currentVideoIndex]; const t = Math.floor(document.getElementById('mainVideo').currentTime);
            const url = `${window.location.origin}${window.location.pathname}?v=${encodeURIComponent(v.video)}&t=${t}`;
            navigator.clipboard.writeText(url).then(() => showToast("🔗 Lien copié avec le timestamp !"));
        }
        function chargerVideoDepuisURL() {
            const params = new URLSearchParams(window.location.search); const vUrl = params.get('v'); const t = parseInt(params.get('t')) || 0;
            if (vUrl && allVideos.length > 0) {
                const index = allVideos.findIndex(v => v.video === vUrl);
                if (index !== -1) { setTimeout(() => { jouerVideo(index); document.getElementById('mainVideo').currentTime = t; showToast("📍 Reprise depuis le lien partagé"); }, 500); }
            }
        }
        function toggleCinemaMode() {
            const p = document.getElementById('mainPlayer'); p.classList.toggle('cinema-mode');
            showToast(p.classList.contains('cinema-mode') ? "🎬 Mode cinéma activé" : "Mode cinéma désactivé");
        }

        const playerObserver = new IntersectionObserver((entries) => {
            const player = document.getElementById('mainPlayer');
            if (!entries[0].isIntersecting && !document.getElementById('mainVideo').paused) {
                player.classList.add('mini-player');
            } else {
                player.classList.remove('mini-player');
            }
        }, { threshold: 0.1 });

        function contextAction(action) {
            document.getElementById('contextMenu').style.display = 'none';
            if (!contextTargetVideo) return;
            const url = contextTargetVideo.video;
            if (action === 'play') { jouerVideo(allVideos.findIndex(v => v.video === url)); }
            else if (action === 'fav') { toggleFavorite(url, null); }
            else if (action === 'copy') { navigator.clipboard.writeText(url).then(() => showToast(" Lien copié !")); }
        }
        document.addEventListener('click', () => { document.getElementById('contextMenu').style.display = 'none'; });

        document.addEventListener('keydown', (e) => {
            if (document.activeElement.id === 'searchInput') { if (e.key === 'Escape') document.activeElement.blur(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); return; }

            const v = document.getElementById('mainVideo');
            if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
            if (e.code === 'KeyF') { e.preventDefault(); document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen(); }
            if (e.code === 'KeyC') { e.preventDefault(); toggleCinemaMode(); }
            if (e.code === 'KeyM') { e.preventDefault(); v.muted = !v.muted; showToast(v.muted ? "🔇 Muet" : "🔊 Son activé"); }
            if (e.code === 'ArrowRight') { e.preventDefault(); v.currentTime += 10; }
            if (e.code === 'ArrowLeft') { e.preventDefault(); v.currentTime -= 10; }
            if (e.code === 'KeyS') { e.preventDefault(); currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length; v.playbackRate = playbackSpeeds[currentSpeedIndex]; showToast(` Vitesse : ${playbackSpeeds[currentSpeedIndex]}x`); }
            
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) && document.activeElement.id !== 'searchInput') {
                e.preventDefault();
                const items = document.querySelectorAll('.video-item');
                if (items.length === 0) return;
                const columns = Math.floor(document.querySelector('.video-grid').offsetWidth / 240);
                
                if (focusedGridIndex === -1) focusedGridIndex = 0;
                else {
                    if (e.code === 'ArrowRight') focusedGridIndex = Math.min(focusedGridIndex + 1, items.length - 1);
                    if (e.code === 'ArrowLeft') focusedGridIndex = Math.max(focusedGridIndex - 1, 0);
                    if (e.code === 'ArrowDown') focusedGridIndex = Math.min(focusedGridIndex + columns, items.length - 1);
                    if (e.code === 'ArrowUp') focusedGridIndex = Math.max(focusedGridIndex - columns, 0);
                }
                
                items.forEach(i => i.classList.remove('focused'));
                items[focusedGridIndex].classList.add('focused');
                items[focusedGridIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                if (e.code === 'Enter') {
                    const idx = parseInt(items[focusedGridIndex].dataset.index);
                    jouerVideo(idx);
                }
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allVideos.filter(v => v.titre.toLowerCase().includes(q));
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.filter-tab').classList.add('active');
            afficherGrille(filtered);
        });

        document.addEventListener('DOMContentLoaded', () => {
            chargerToutesLesVideos(); setupProgressSaving(); chargerVideoDepuisURL();
            setTimeout(() => playerObserver.observe(document.getElementById('mainPlayer')), 1000);
        });
    </script>
</body>
</html>
