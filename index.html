<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Galerie Vidéo</title>
    <style>
        /* --- RESET & STYLE DE BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- LECTEUR PRINCIPAL --- */
        .main-player {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
            max-height: 70vh; /* Ne dépasse pas 70% de la hauteur de l'écran */
            background: #000;
        }
        
        .video-info {
            padding: 15px 20px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }
        
        .video-info h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        /* --- LISTE DES VIDÉOS (GRILLE) --- */
        .video-list-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .video-count {
            background: #333;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* --- VIGNETTE INDIVIDUELLE --- */
        .video-item {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
        }
        
        .video-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            border-color: #0088cc;
        }
        
        .video-item.active {
            border-color: #0088cc;
            background: #252525;
        }
        
        .video-item img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #111; /* Fond pendant le chargement */
        }
        
        .video-item .title {
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ddd;
            /* Gestion du texte long sur 2 lignes max */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        
        .video-item.active .title {
            color: #0088cc;
            font-weight: 700;
        }

        /* --- ÉTATS DE CHARGEMENT ET ERREUR --- */
        .loading-state {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }

        .error-state {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            grid-column: 1 / -1;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .video-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 colonnes sur mobile */
                gap: 10px;
            }
            .video-info h2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 1. LECTEUR VIDÉO PRINCIPAL -->
    <div class="main-player">
        <video id="mainVideo" controls poster="https://via.placeholder.com/800x450/111111/555555?text=Chargement...">
            <source src="" type="video/mp4">
            Votre navigateur ne supporte pas la lecture de vidéos HTML5.
        </video>
        <div class="video-info">
            <h2 id="mainTitle">Sélectionnez une vidéo ci-dessous</h2>
        </div.>
    </div>

    <!-- 2. GRILLE DES VIDÉOS -->
    <div class="video-list-title">
        <span>📁 Playlist</span>
        <span class="video-count" id="videoCount">0 vidéo</span>
    </div>
    
    <div class="video-grid" id="videoGrid">
        <div class="loading-state">⏳ Chargement de la playlist...</div.>
    </div>

    <!-- 3. LOGIQUE JAVASCRIPT -->
    <script>
        const JSON_URL = 'videos.json'; // Le fichier contenant vos données

        /**
         * Extrait automatiquement le nom du dossier Internet Archive 
         * pour construire le lien de la vignette (__ia_thumb.jpg)
         */
        function obtenirVignetteAuto(urlVideo) {
            // Cherche "/items/NOM_DU_DOSSIER/" ou "/download/NOM_DU_DOSSIER/" dans l'URL
            const match = urlVideo.match(/\/(?:items|download)\/([^\/]+)\//);
            if (match && match[1]) {
                return `https://archive.org/download/${match[1]}/__ia_thumb.jpg`;
            }
            // Fallback si le format de l'URL est différent
            return 'https://via.placeholder.com/320x180/222222/888888?text=Pas+de+vignette';
        }

        /**
         * Charge les données du JSON et construit la grille
         */
        async function chargerPlaylist() {
            const grid = document.getElementById('videoGrid');
            const countSpan = document.getElementById('videoCount');
            const mainVideo = document.getElementById('mainVideo');
            const mainTitle = document.getElementById('mainTitle');

            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error('Impossible de lire le fichier videos.json');
                
                const videos = await response.json();
                
                if (videos.length === 0) {
                    grid.innerHTML = '<div class="loading-state">Aucune vidéo dans la playlist.</div>';
                    return;
                }

                countSpan.textContent = `${videos.length} vidéo${videos.length > 1 ? 's' : ''}`;
                grid.innerHTML = ''; // Vider le message de chargement

                // Créer les éléments de la grille
                videos.forEach((video, index) => {
                    const vignetteUrl = obtenirVignetteAuto(video.video);
                    const isActive = index === 0; // La première est active par défaut

                    const item = document.createElement('div');
                    item.className = `video-item ${isActive ? 'active' : ''}`;
                    item.onclick = () => jouerVideo(video, vignetteUrl, item);

                    item.innerHTML = `
                        <img src="${vignetteUrl}" alt="${video.titre}" 
                             onerror="this.src='https://via.placeholder.com/320x180/222222/888888?text=Erreur+image'">
                        <div class="title">${video.titre}</div>
                    `;
                    grid.appendChild(item);

                    // Préparer la première vidéo dans le lecteur (sans la lancer automatiquement)
                    if (isActive) {
                        mainTitle.textContent = video.titre;
                        mainVideo.querySelector('source').src = video.video;
                        mainVideo.poster = vignetteUrl;
                        mainVideo.load(); // Précharge les métadonnées
                    }
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="error-state">❌ Erreur : ${error.message}<br>Vérifiez que le fichier <code>videos.json</code> est bien présent.</div>`;
            }
        }

        /**
         * Change la vidéo en cours de lecture au clic sur une vignette
         */
        function jouerVideo(videoData, vignetteUrl, elementClique) {
            const mainVideo = document.getElementById('mainVideo');
            const source = mainVideo.querySelector('source');
            const mainTitle = document.getElementById('mainTitle');

            // Mise à jour des sources
            source.src = videoData.video;
            mainVideo.poster = vignetteUrl;
            mainTitle.textContent = videoData.titre;

            // Rechargement et lecture
            mainVideo.load();
            mainVideo.play().catch(e => {
                // Ignore l'erreur si le navigateur bloque l'autoplay (comportement normal)
                console.log("Lecture automatique bloquée par le navigateur, l'utilisateur doit cliquer sur Play.");
            });

            // Mise à jour visuelle de la grille (classe 'active')
            document.querySelectorAll('.video-item').forEach(item => item.classList.remove('active'));
            elementClique.classList.add('active');

            // Remonter doucement vers le lecteur vidéo (très utile sur mobile)
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Lancer le chargement au démarrage de la page
        document.addEventListener('DOMContentLoaded', chargerPlaylist);
    </script>
</body>
</html>
